<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18231e">
  <meta name="description" content="Deine Rezeptsammlung für jeden Tag. Entdecke Lieblingsgerichte für Thermomix, Airfryer und die klassische Küche.">
  <title>Kcooks · Rezepte</title>
  <link rel="icon" href="Images/favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <a class="skip-link" href="#recipes">Zu den Rezepten</a>
  <header class="site-header page-width">
    <a class="brand" href="index.html" aria-label="Kcooks Startseite"><span class="brand-mark" data-icon="leaf"></span>Kcooks<span class="brand-dot">.</span></a>
    <div class="header-actions"><button id="themeToggle" class="icon-button" type="button" aria-label="Dunkles Design aktivieren"></button></div>
  </header>
  <main class="page-width">
    <section class="recipe-section" id="recipes" aria-labelledby="collectionTitle">
      <div class="collection-heading"><h1 id="collectionTitle">Rezepte</h1><span id="recipeTotal" class="collection-total"></span></div>
      <div class="search-toolbar">
        <label class="search-field"><span data-icon="search"></span><span class="sr-only">Rezepte durchsuchen</span><input type="search" id="mySearchbar" placeholder="Worauf hast du Appetit?" autocomplete="off"></label>
        <button class="button filter-button" id="toggleFilters" type="button" aria-controls="filterContainer" aria-expanded="false"><span data-icon="filter"></span>Filter<span id="filterCount" class="filter-count" hidden></span></button>
      </div>
      <div class="browse-toolbar">
        <div id="categoryTabs" class="category-tabs" role="group" aria-label="Zubereitungsart">
          <button type="button" class="category-button active" data-category="" aria-pressed="true">Alle Rezepte</button>
          <button type="button" class="category-button" data-category="normal" aria-pressed="false">Klassisch</button>
          <button type="button" class="category-button" data-category="Thermomix" aria-pressed="false">Thermomix</button>
          <button type="button" class="category-button" data-category="Airfryer" aria-pressed="false">Airfryer</button>
        </div>
        <button id="randomButton" class="random-button" type="button" title="Drei zufällige Rezepte aus deiner aktuellen Auswahl anzeigen"><span data-icon="shuffle"></span>Überrasch mich</button>
      </div>
      <div class="filter-panel" id="filterContainer" hidden>
        <div class="filter-panel-heading"><h3>Mach es zu deinem Rezept.</h3><button class="text-button" id="resetFilters" type="button">Filter zurücksetzen</button></div>
        <div id="filterGroups" class="filter-grid"></div>
      </div>
      <div class="results-heading"><p id="resultCount" role="status" aria-live="polite">Die Rezepte werden geladen …</p></div>
      <div id="imgHolder" class="recipe-grid" aria-busy="true"></div>
      <div id="emptyState" class="empty-state" hidden></div>
      <nav id="pagination" class="pagination" aria-label="Rezeptseiten" hidden>
        <button id="prevPage" class="icon-button" type="button" aria-label="Vorherige Seite"><span data-icon="back"></span></button>
        <span id="pageLabel"></span>
        <button id="nextPage" class="icon-button" type="button" aria-label="Nächste Seite"><span data-icon="arrow"></span></button>
      </nav>
      <noscript><p class="empty-state">Bitte aktiviere JavaScript, um die Rezeptsammlung zu durchsuchen.</p></noscript>
    </section>
  </main>
</body>
</html>
